{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>ESP Sensor Dashboard</title>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Данные с Wemos D1 Mini</h1>

        <div class="row">
            <div class="col-md-4">
                <h4 class="text-center">Температура (°C)</h4>
                <canvas id="tempChart"></canvas>
            </div>
            <div class="col-md-4">
                <h4 class="text-center">Влажность (%)</h4>
                <canvas id="humChart"></canvas>
            </div>
            <div class="col-md-4">
                <h4 class="text-center">Давление (hPa)</h4>
                <canvas id="presChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="{% static 'main.js' %}"></script>
</body>
</html>
